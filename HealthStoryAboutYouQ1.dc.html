    const TX = [{"n": "Radiation", "k": "rad", "f": [{"type": "date", "k": "last", "t": "When was the last radiation you had?"}, {"type": "sa", "k": "areas", "t": "Which parts of your body have you had radiation?", "ph": "Search body areas\u2026", "list": ["Breast", "Chest wall", "Lymph nodes", "Brain", "Head and neck", "Thyroid", "Lung", "Liver", "Stomach", "Abdomen", "Pelvis", "Spine", "Hip", "Skin"], "help": "Add every area that was treated. Can\u2019t find it? Type its name and choose \u201cAdd.\u201d Not sure? Leave blank."}, {"type": "yn", "k": "plan", "t": "Do you have any future radiation planned?"}]}, {"n": "Chemotherapy", "k": "chemo", "f": [{"type": "sa", "k": "drugs", "t": "Which chemotherapy drugs?", "ph": "Search chemo drugs\u2026", "list": ["Cisplatin", "Carboplatin", "Oxaliplatin", "FOLFOX", "FOLFIRI", "FOLFIRINOX", "Doxorubicin (Adriamycin)", "Epirubicin", "Cyclophosphamide", "Paclitaxel (Taxol)", "Docetaxel (Taxotere)", "5-Fluorouracil (5-FU)", "Capecitabine (Xeloda)", "Gemcitabine", "Irinotecan", "Etoposide", "Vincristine", "Methotrexate", "Pemetrexed (Alimta)", "Bleomycin"], "help": "Different drugs affect the body differently, so we ask by name. Add all that apply. Combination therapy is common. Can\u2019t find a drug? Type its name and choose \u201cAdd.\u201d Not sure? Leave blank."}, {"type": "date", "k": "last", "t": "When was the last chemotherapy you had?"}, {"type": "yn", "k": "plan", "t": "Do you have any future chemotherapy planned?"}]}, {"n": "Surgery", "k": "surg", "f": [{"type": "date", "k": "last", "t": "When was the last surgery you had?"}, {"type": "sa", "k": "areas", "t": "Which parts of your body have you had surgery?", "ph": "Search body areas\u2026", "list": ["Breast", "Chest wall", "Lymph nodes", "Brain", "Head and neck", "Thyroid", "Lung", "Liver", "Stomach", "Abdomen", "Pelvis", "Spine", "Hip", "Skin"], "help": "Add every area that was treated. Can\u2019t find it? Type its name and choose \u201cAdd.\u201d Not sure? Leave blank."}, {"type": "yn", "k": "plan", "t": "Do you have any future surgery planned?"}]}, {"n": "Immunotherapy", "k": "immuno", "f": [{"type": "date", "k": "last", "t": "When was the last immunotherapy you had?"}, {"type": "yn", "k": "plan", "t": "Do you have any future immunotherapy planned?"}]}, {"n": "Hormone therapy", "k": "hormone", "f": [{"type": "date", "k": "last", "t": "When was the last hormone therapy you had?"}, {"type": "yn", "k": "plan", "t": "Do you have any future hormone therapy planned?"}]}, {"n": "Clinical trial", "k": "trial", "f": [{"type": "yn", "k": "in", "t": "Are you part of a clinical trial?"}]}, {"n": "Something else", "k": "other", "f": [{"type": "text", "k": "what", "t": "What other treatment?", "ph": "Type the treatment"}]}, {"n": "Nothing right now", "k": "none"}]; const TX_EXCL = [7];
    const WAIST_HELP = {title:'How to measure your waist', body:'<ol><li>Stand up and wrap a soft tape measure around your bare waist.</li><li>Position it level with your belly button, midway between your lowest rib and hip bone.</li><li>Breathe out normally, then read the number where the tape meets snug, not squeezing.</li></ol>'};

    const root = document.getElementById('qroot');
    if (!root) return;
    const K = 'kibo-hs';
    const load = () => { try { return JSON.parse(window.localStorage.getItem(K) || '{}'); } catch (e) { return {}; } };
    const A = load();
    const save = () => { try { window.localStorage.setItem(K, JSON.stringify(A)); } catch (e) {} };
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const visible = () => QS.filter((q) => !q.when || q.when(A));
    const i = START;
    const FILE = (k) => 'HealthStory' + SLUG + 'Q' + (k + 1) + '.dc.html';
    const RET = (() => { try { return window.localStorage.getItem('kibo-hs-return') === '1'; } catch (e) { return false; } })();
    const nextFile = () => { if (RET) return 'DashboardStory.dc.html'; for (let k = START + 1; k < QS.length; k++) if (!QS[k].when || QS[k].when(A)) return FILE(k); return NEXT; };
    const prevFile = () => { if (RET) return 'DashboardStory.dc.html'; for (let k = START - 1; k >= 0; k--) if (!QS[k].when || QS[k].when(A)) return FILE(k); return PREV; };
    const leave = (ms) => this.timers.push(setTimeout(() => {
      const a = document.createElement('a'); a.href = nextFile(); a.hidden = true; a.setAttribute('aria-hidden', 'true');
      root.appendChild(a); a.click();
    }, ms));
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const YEARS = []; for (let y = new Date().getFullYear(); y >= 1990; y--) YEARS.push(y);
    const sel = (key, val, ph, list) => '<select class="inp" data-k="' + key + '" aria-label="' + ph + '"><option value="">' + ph + '</option>' +
      list.map((v) => '<option' + (String(val) === String(v) ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>';
    const getp = (path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), A);
    const setp = (path, v) => { const ks = path.split('.'); let o = A; ks.slice(0, -1).forEach((k) => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }); o[ks[ks.length - 1]] = v; save(); };
    const pill = (attrs, label, on, multi) => '<button type="button" class="opt" ' + attrs + (multi ? ' role="checkbox" aria-checked="' + !!on + '"' : ' aria-pressed="' + !!on + '"') + '>' + (multi ? '<span class="cb" aria-hidden="true"></span>' : '<span class="rd" aria-hidden="true"></span>') + '<span>' + esc(label) + '</span></button>';
    const yesno = (key) => '<div class="seg">' + ['Yes', 'No'].map((v) => '<button type="button" data-yn="' + key + '" data-v="' + v + '" aria-pressed="' + (getp(key) === v) + '">' + v + '</button>').join('') + '</div>';
    const searchAdd = (key, ph, list, help) => {
      const chosen = getp(key) || [];
      return '<div class="sa" data-sa="' + key + '"><input class="inp" placeholder="' + ph + '" autocomplete="off" data-sain="' + key + '"><div class="sa-list" hidden></div></div>' +
        (help ? '<p class="qh">' + help + '</p>' : '') +
        '<div class="chips">' + chosen.map((c, n) => '<span class="chip">' + esc(c) + '<button type="button" aria-label="Remove ' + esc(c) + '" data-rm="' + key + '" data-n="' + n + '">×</button></span>').join('') + '</div>';
    };
    const SALIST = {};
    const ok = (q) => {
      const v = A[q.id];
      if (q.k === 'one') return v != null;
      if (q.k === 'pick') {
        if (q.optional) return true;
        if (v == null) return false;
        if (q.other != null && v === q.other && !(A[q.id + '_other'] || '').trim()) return false;
        if (q.follow && q.follow.when(A) && A[q.follow.id] == null) return false;
        return true;
      }
      if (q.k === 'multi') return q.optional || (Array.isArray(v) && v.length > 0) || !!A[q.id + '_file'];
      if (q.k === 'dates') return q.items.every((it) => A[it.id + '_m'] && A[it.id + '_y']);
      if (q.k === 'waist') return +A.waist > 0;
      if (q.k === 'tx') return Array.isArray(A.tx) && A.tx.length > 0;
      return true;
    };
    const progress = () => Math.round(((PART + (START / QS.length)) / 5) * 100);

    const body = (q) => {
      let h = '<h1 class="qt" id="qt">' + q.t + '</h1>' + (q.h ? '<p class="qh">' + q.h + '</p>' : '');
      const v = A[q.id];
      if (q.k === 'one' || q.k === 'pick') {
        h += '<div class="opts" role="radiogroup" aria-labelledby="qt">' + q.o.map((o, n) => pill('data-one="' + n + '"', o, v === n)).join('') + '</div>';
        if (q.other != null && v === q.other) h += '<label class="lbl" for="oth">' + q.otherLabel + '</label><input class="inp" id="oth" data-txt="' + q.id + '_other" placeholder="' + q.otherPh + '" value="' + esc(A[q.id + '_other']) + '">';
        if (q.follow && q.follow.when(A)) {
          const f = q.follow, fv = A[f.id];
          h += '<div class="sub"><h2 class="qt" id="qt2">' + f.t + '</h2><div class="opts" role="radiogroup" aria-labelledby="qt2">' + f.o.map((o, n) => pill('data-fol="' + n + '"', o, fv === n)).join('') + '</div></div>';
        }
      }
      if (q.k === 'multi') {
        const arr = Array.isArray(v) ? v : [];
        h += '<div class="opts" role="group" aria-labelledby="qt">' + q.o.map((o, n) => pill('data-multi="' + n + '"', o, arr.includes(n), true)).join('') + '</div>';
        if (q.other != null && arr.includes(q.other)) h += '<label class="lbl" for="oth">' + q.otherLabel + '</label><input class="inp" id="oth" data-txt="' + q.id + '_other" placeholder="' + q.otherPh + '" value="' + esc(A[q.id + '_other']) + '">';
        if (q.upload) {
          const fname = A[q.id + '_file'];
          h += '<div class="upl-or"><span>or</span></div>' + (fname
            ? '<div class="upl-done"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span>' + esc(fname) + '</span><button type="button" data-rmfile="1" aria-label="Remove file">\u00d7</button></div>'
            : '<label class="upl"><input type="file" accept="image/*,.pdf" data-file="' + q.id + '"><span class="upl-ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span><span><strong>' + q.upload.label + '</strong><span class="upl-sub">' + q.upload.hint + '</span></span></label>');
        }
        if (q.info) h += '<button type="button" class="info" data-info="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>' + q.info.link + '</button>';
      }
      if (q.k === 'dates') {
        q.items.forEach((it) => { h += '<span class="lbl">' + it.t + '</span><div class="two">' + sel(it.id + '_m', A[it.id + '_m'], 'Month', MONTHS) + sel(it.id + '_y', A[it.id + '_y'], 'Year', YEARS) + '</div>'; });
      }
      if (q.k === 'waist') {
        const u = A.waistUnit || 'in';
        h += '<div class="unit" role="group" aria-label="Unit">' + ['in', 'cm'].map((x) => '<button type="button" data-unit="' + x + '" aria-pressed="' + (u === x) + '">' + x + '</button>').join('') + '</div>' +
          '<div class="suffix" style="margin-top:14px"><input class="inp" inputmode="decimal" data-num="waist" placeholder="Enter waist measurement e.g ' + (u === 'in' ? '34' : '86') + '" value="' + esc(A.waist) + '" aria-label="Waist measurement"><span>' + u + '</span></div>' +
          '<button type="button" class="info" data-info="1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>How to measure</button>';
      }
      if (q.k === 'tx') {
        const arr = Array.isArray(A.tx) ? A.tx : [];
        h += '<div class="opts" role="group" aria-labelledby="qt">';
        TX.forEach((t, n) => {
          const on = arr.includes(n), row = pill('data-multi="' + n + '"', t.n, on, true);
          if (!on || !t.f) { h += row; return; }
          let p = '<div class="panel">' + row;
          t.f.forEach((f) => {
            const key = 'txd.' + t.k + '.' + f.k;
            if (f.type === 'date') p += '<span class="lbl">' + f.t + '</span><div class="two">' + sel(key + '_m', getp(key + '_m'), 'Month', MONTHS) + sel(key + '_y', getp(key + '_y'), 'Year', YEARS) + '</div>';
            if (f.type === 'yn') p += '<span class="lbl">' + f.t + '</span>' + yesno(key);
            if (f.type === 'sa') { SALIST[key] = f.list; p += '<span class="lbl">' + f.t + ' <em>(select all you know)</em></span>' + searchAdd(key, f.ph, f.list, f.help); }
            if (f.type === 'text') p += '<label class="lbl">' + f.t + '</label><input class="inp" data-txt="' + key + '" placeholder="' + f.ph + '" value="' + esc(getp(key)) + '">';
          });
          h += p + '</div>';
        });
        h += '</div>';
      }
      return h;
    };

    const render = (focusSel) => {
      const q = QS[START];
      const back = '<a class="qback" href="' + prevFile() + '">', backEnd = '</a>';
      const auto = q.k === 'one' || q.auto;
      let foot = '';
      if (!auto || (q.other != null && A[q.id] === q.other)) {
        const can = ok(q);
        foot = '<div class="foot">' + '<a class="qbtn" href="' + nextFile() + '" aria-disabled="' + !can + '">Continue</a>' +
          (q.optional ? '<p class="skipnote">Optional. You can continue without answering.</p>' : '') + '</div>';
      }
      root.innerHTML = '<div class="card"><div class="qtop">' + back + '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Back' + backEnd + '<span class="qpart">' + PARTNAME + '</span></div>' + '<div class="bar" role="progressbar" aria-label="Health story progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + progress() + '"><span style="width:' + Math.max(progress(), 4) + '%"></span></div>' +
        '<div class="qcount" aria-live="polite">' + (() => { const v = visible(); let n = v.indexOf(QS[START]); if (n < 0) n = START; return 'Question ' + (n + 1) + ' of ' + Math.max(v.length, n + 1); })() + '</div>' +
        '<div class="card-in"><div class="qbody' + (i !== this.lastStep ? ' anim' : '') + '" data-step="' + i + '">' + body(q) + '</div>' + foot + '</div></div>';
      this.lastStep = i;
      if (focusSel) { const el = root.querySelector(focusSel); if (el) { el.focus({ preventScroll: true }); if (el.setSelectionRange) { const n = el.value.length; el.setSelectionRange(n, n); } } }
    };
    const rerender = (focusSel) => {
      // Keep the reader where they were: remember the card's inner scroll and the page scroll
      const y = window.scrollY, ob = root.querySelector('.qbody'), st = ob ? ob.scrollTop : 0;
      render(focusSel);
      const nb = root.querySelector('.qbody'); if (nb) nb.scrollTop = st;
      window.scrollTo(0, y);
      if (focusSel) { const el = root.querySelector(focusSel); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
    };
    const refreshFoot = () => { const q = QS[START], b = root.querySelector('.qbtn'); if (b) b.setAttribute('aria-disabled', String(!ok(q))); };
    const go = (d) => { i += d; render(); const c = root.querySelector('.card'); if (c && c.getBoundingClientRect().top < 0) window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const modal = (q) => {
      const m = q.k === 'waist' ? WAIST_HELP : q.info;
      const bg = document.createElement('div'); bg.className = 'modal-bg';
      bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="modal-h"><h2 id="mh">' + m.title + '</h2><button type="button" class="x" aria-label="Close">×</button></div>' + m.body + '<button type="button" class="qbtn ok">Got it</button></div>';
      const close = () => bg.remove();
      bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('.x') || e.target.closest('.ok')) close(); });
      document.body.appendChild(bg); bg.querySelector('.ok').focus();
    };

    root.addEventListener('click', (e) => {
      const q = QS[START], t = e.target;
      const b = t.closest('button, a'); if (!b) { return; }
      if (b.dataset.back) return go(-1);
      if (b.dataset.next) { if (ok(q)) go(1); return; }
      if (b.dataset.info) return modal(q);
      if (b.dataset.rmfile) { delete A[q.id + '_file']; save(); return rerender(); }
      const autoPick = () => {
        if (!q.auto || !ok(q) || (q.other != null && A[q.id] === q.other)) return;
        leave(380);
      };
      if (b.dataset.one != null) {
        A[q.id] = +b.dataset.one; save();
        if (q.k === 'one') {
          rerender();
          leave(380);
        } else { rerender(q.other != null && A[q.id] === q.other ? '#oth' : null); autoPick(); }
        return;
      }
      if (b.dataset.fol != null) { A[q.follow.id] = +b.dataset.fol; save(); rerender(); return autoPick(); }
      if (b.dataset.multi != null) {
        const n = +b.dataset.multi, key = q.k === 'tx' ? 'tx' : q.id, ex = q.k === 'tx' ? TX_EXCL : (q.excl || []);
        let arr = Array.isArray(A[key]) ? A[key].slice() : [];
        if (arr.includes(n)) arr = arr.filter((x) => x !== n);
        else { arr = ex.includes(n) ? [n] : arr.filter((x) => !ex.includes(x)).concat(n); }
        A[key] = arr; save();
        return rerender(q.other != null && n === q.other && arr.includes(n) ? '#oth' : null);
      }
      if (b.dataset.yn) { setp(b.dataset.yn, b.dataset.v); return rerender(); }
      if (b.dataset.unit) { A.waistUnit = b.dataset.unit; save(); return rerender('[data-num]'); }
      if (b.dataset.rm) { const arr = (getp(b.dataset.rm) || []).slice(); arr.splice(+b.dataset.n, 1); setp(b.dataset.rm, arr); return rerender(); }
      if (b.dataset.pick) { const key = b.dataset.key, arr = (getp(key) || []).slice(); if (!arr.includes(b.dataset.pick)) arr.push(b.dataset.pick); setp(key, arr); return rerender('[data-sain="' + key + '"]'); }
    });
    const saOpen = (input) => {
      const key = input.dataset.sain, box = input.parentNode.querySelector('.sa-list'), qv = input.value.trim().toLowerCase();
      const chosen = getp(key) || [], list = (SALIST[key] || []).filter((x) => !chosen.includes(x) && (!qv || x.toLowerCase().includes(qv))).slice(0, 7);
      let h = list.map((x, n) => '<button type="button" data-pick="' + esc(x) + '" data-key="' + key + '"' + (n === 0 ? ' class="hi"' : '') + '>' + esc(x) + '</button>').join('');
      const raw = input.value.trim();
      if (raw && !(SALIST[key] || []).some((x) => x.toLowerCase() === raw.toLowerCase())) h += '<button type="button" class="add" data-pick="' + esc(raw) + '" data-key="' + key + '">Add “' + esc(raw) + '”</button>';
      box.innerHTML = h; box.hidden = !h;
    };
    root.addEventListener('input', (e) => {
      const t = e.target, q = QS[START];
      if (t.dataset.txt) { setp(t.dataset.txt, t.value); refreshFoot(); }
      if (t.dataset.num) { A.waist = t.value.replace(/[^0-9.]/g, ''); if (t.value !== A.waist) t.value = A.waist; save(); refreshFoot(); }
      if (t.dataset.sain) saOpen(t);
    });
    root.addEventListener('change', (e) => { const t = e.target; if (t.dataset.k) { setp(t.dataset.k, t.value); refreshFoot(); } if (t.dataset.file && t.files && t.files[0]) { A[t.dataset.file + '_file'] = t.files[0].name; save(); rerender(); } });
    root.addEventListener('mousedown', (e) => { const t = e.target; if (t.dataset && t.dataset.sain) saOpen(t); });
    root.addEventListener('focusout', (e) => { const t = e.target; if (t.dataset && t.dataset.sain) this.timers.push(setTimeout(() => { const box = t.parentNode && t.parentNode.querySelector('.sa-list'); if (box && !box.contains(document.activeElement)) box.hidden = true; }, 180)); });
    root.addEventListener('keydown', (e) => {
      const t = e.target;
      if (t.dataset && t.dataset.sain && e.key === 'Escape') { const box = t.parentNode.querySelector('.sa-list'); if (box) box.hidden = true; }
      if (t.dataset && t.dataset.sain && e.key === 'ArrowDown') { e.preventDefault(); saOpen(t); }
      if (t.dataset && t.dataset.sain && e.key === 'Enter') { e.preventDefault(); const f = t.parentNode.querySelector('.sa-list button'); if (f) f.click(); }
    });
    render();
    // Pick up resets and answers from other screens (e.g. a new play-through clears everything)
    this.syncIv = setInterval(() => {
      const fresh = load();
      if (JSON.stringify(fresh) !== JSON.stringify(A)) { Object.keys(A).forEach((k) => delete A[k]); Object.assign(A, fresh); const f = document.activeElement; if (!(f && root.contains(f) && f.tagName === 'INPUT')) rerender(); }
    }, 500);

  }
  componentWillUnmount() { clearInterval(this.iv); clearInterval(this.syncIv); (this.timers || []).forEach(clearTimeout); }
  renderVals() { return {}; }
}

return Component;
})();</script>
