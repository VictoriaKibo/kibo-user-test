:root{
  --blue:#0432FF; --blue-hover:#0329D6; --ink:#1A1A2E; --ink2:#3A3F58; --muted:#7A7F99;
  --left:#F8F9FD; --right:#EBEEF7; --line:#D9DCE8; --line2:#E4E7F0; --field:#FFFFFF; --locked:#E9ECF5;
  --disabled:#BFC9EB; --ok:#2FA36B; --err:#C2362B;
  --head:'Coolvetica',Montserrat,'Helvetica Neue',Arial,sans-serif;
  --body:'Fira Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--left)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--blue)}
.ca{display:grid;grid-template-columns:minmax(0,730fr) minmax(0,710fr);min-height:100vh;background:var(--left)}
.ca-left{padding:34px 80px 64px;display:flex;flex-direction:column}
.ca-logo{display:inline-flex;align-self:flex-start;margin-left:-7px}
.ca-logo img{height:30px;width:auto;display:block}
.ca-form{width:100%;max-width:562px;margin-top:52px;display:flex;flex-direction:column}
.ca-title{font-family:var(--head);font-weight:300;font-size:32px;line-height:1.22;letter-spacing:-0.01em;margin:0;color:var(--ink)}
.ca-sub{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--muted);font-weight:300}
.ca-label{font-size:18px;line-height:1.5;color:var(--ink);margin:0}
.ca-back{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:32px;color:var(--ink2);text-decoration:none;font-size:16px;padding:4px 0}
.ca-back:hover{color:var(--blue)}
.ca-back svg{width:16px;height:16px}
.ca-text{font-size:16px;line-height:1.75;color:var(--ink2);margin:0}
.ca-text strong{font-weight:400;color:var(--ink)}
/* social */
.soc{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.soc a{position:relative;display:flex;align-items:center;justify-content:center;height:60px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.soc a:hover{border-color:#B9C2DE;box-shadow:0 2px 10px rgba(26,26,46,.06)}
.soc a svg{position:absolute;left:31px;top:17px;width:26px;height:26px}
.or{display:flex;align-items:center;gap:13px;margin:30px 0;color:var(--muted);font-size:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
/* inputs */
.inp{display:block;width:100%;height:60px;padding:0 20px;border:1px solid var(--line);border-radius:20px;background:var(--field);font-size:16px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:#8D92AA}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(4,50,255,.12)}
.inp.bad{border-color:var(--err)}
.locked{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px;border-radius:20px;background:var(--locked);font-size:16px;color:var(--ink)}
.help{font-size:14px;color:var(--muted);margin:8px 0 0}
.help.err{color:var(--err)}
.help.ok{color:var(--ok)}
/* floating-label fields (payment) */
.fl{position:relative;display:block}
.fl .inp{padding-top:18px}
.fl span{position:absolute;left:21px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink2);pointer-events:none;transition:all .15s ease}
.fl .inp::placeholder{color:transparent}
.fl .inp:focus::placeholder{color:#B4B8CA}
.fl .inp:focus + span,.fl .inp:not(:placeholder-shown) + span{top:17px;font-size:14px;color:var(--muted)}
.fl .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:500;font-size:16px;text-decoration:none;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn:hover{background:var(--blue-hover)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--blue)}
.btn[aria-disabled="true"]{background:var(--disabled);pointer-events:none;cursor:default}
.btn.busy{background:#8DA2EC;pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.links{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:22px;font-size:14px;color:var(--ink)}
.links>span{white-space:nowrap}
.tl{background:none;border:0;padding:0;color:var(--blue);font-weight:500;cursor:pointer;font-size:14px;text-decoration:none}
.tl:hover{text-decoration:underline}
.consent{margin:40px 0 0;font-size:14px;line-height:1.55;color:var(--ink2)}
.consent a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.elig{position:relative;display:flex;gap:12px;align-items:flex-start;margin-top:24px;padding:16px 18px;border-radius:16px;background:#fff;border:1px solid var(--line2);cursor:pointer;font-size:15px;line-height:1.5;color:var(--ink)}
.elig input{position:absolute;opacity:0;width:22px;height:22px;margin:0;left:18px;top:16px;cursor:pointer}
.elig .bx{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid #9DA3BC;background:#fff;margin-top:1px;display:grid;place-items:center;transition:all .15s}
.elig input:checked + .bx{background:var(--blue);border-color:var(--blue)}
.elig input:checked + .bx::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.elig input:focus-visible + .bx{box-shadow:0 0 0 3px rgba(4,50,255,.2)}
.elig:has(input:checked){border-color:#B9C6FF;background:#F4F6FF}
/* right panel */
.ca-right{position:relative;background:var(--right);overflow:hidden;min-height:100%}

.dots{position:absolute;right:73px;bottom:121px;width:145px;height:45px;border-radius:999px;background:rgba(220,226,240,.92);display:flex;align-items:center;justify-content:center}
.dots svg{width:97px;height:7px;display:block}
@media (max-width:900px){

  .ca-right{display:none}
  .ca-left{padding:24px 16px 48px}

  .ca-title{font-size:28px}
}

<script>window.__DCProps = "{\"$preview\":{\"width\":1440,\"height\":1440}}";
window.__DCComponent = (function () {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { promo: false }; this.timers = []; }
  componentDidMount() {

    // Keep the right-hand carousel sized to its panel: it fills the visible height beside the form at any screen size
    const caFit = () => { const r = document.querySelector('.ca-right'), st = document.querySelector('.ca-stage'); if (!r || !st) return; const W = r.clientWidth, H = r.clientHeight; if (!W || !H) return; const s = Math.max(0.55, Math.min((W * 0.7) / 460, (H * 0.56) / 420, 1.08)); /* never larger than at 1440 x 900 */ st.style.setProperty('--cas', s.toFixed(3)); const wd = st.querySelector('.cx-wide'), tb = wd && wd.querySelector('.gtab'), sl = document.querySelectorAll('.cx-sl')[2], fr = sl && (sl.querySelector('.cx-from') || sl.querySelector('.cx-tx')); if (wd && tb && fr) { wd.style.transform = ''; const rr = r.getBoundingClientRect(), fb = fr.getBoundingClientRect().bottom - rr.top, tt = tb.getBoundingClientRect().top - rr.top, th = tb.getBoundingClientRect().height; const gap = Math.max(56, Math.min(104, (H - fb - th) * 0.45)); const dy = Math.min(0, (fb + gap) - tt); wd.style.transform = 'translateY(' + (dy / s).toFixed(1) + 'px)'; } };
    caFit(); window.addEventListener('resize', caFit); this.caFit = caFit;
    if (window.ResizeObserver) { const r0 = document.querySelector('.ca-right'); if (r0) { this.caRO = new ResizeObserver(caFit); this.caRO.observe(r0); } }
    const $ = (id) => document.getElementById(id);
    const store = {
      get(k) { try { return window.localStorage.getItem('kibo-ca-' + k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem('kibo-ca-' + k, v); } catch (e) {} }
    };

      const read = () => keys.map((k) => store.get(k) || '').join('|');
      let last = read();

    };

    // and the button resets itself so it can never stay stuck spinning.
    const busyGo = (a, label, ms) => {
      if (!a) return;
      const original = a.innerHTML;
      a.addEventListener('click', () => {
        if (a.getAttribute('aria-disabled') === 'true') return;
        a.classList.add('busy');
        a.innerHTML = '<span>' + label + '</span><span class="spin" aria-hidden="true"></span>';

      });
    };

    const cn = $('cn'), ex = $('ex'), cv = $('cv'), nm = $('nm'), zp = $('zp'), pay = $('ca-pay');
    const name = [store.get('fn'), store.get('ln')].filter(Boolean).join(' ');
    const promo = $('promo'), apply = $('apply'), ph = $('promo-help');
    promo.addEventListener('input', () => { enable(apply, promo.value.trim().length >= 3); ph.style.display = 'none'; });
    apply.addEventListener('click', () => { ph.className = 'help'; ph.textContent = 'Code saved. Stripe checks it when you confirm payment.'; ph.style.display = 'block'; });
    const luhn = (n) => { let s = 0, alt = false; for (let i = n.length - 1; i >= 0; i--) { let d = +n[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; };
    const fmtCard = () => { const d = cn.value.replace(/\D/g, '').slice(0, 16); cn.value = d.replace(/(\d{4})(?=\d)/g, '$1 '); };
    const fmtExp = (e) => { let d = ex.value.replace(/\D/g, '').slice(0, 4); if (d.length === 1 && +d > 1) d = '0' + d; ex.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : (d.length === 2 && e && e.inputType !== 'deleteContentBackward' ? d + ' / ' : d); };
    const expOk = () => { const m = ex.value.match(/^(\d{2}) \/ (\d{2})$/); if (!m) return false; const mo = +m[1], yr = 2000 + +m[2], now = new Date(); return mo >= 1 && mo <= 12 && (yr > now.getFullYear() || (yr === now.getFullYear() && mo >= now.getMonth() + 1)); };

    ex.addEventListener('input', (e) => { fmtExp(e); sync(); });
    cv.addEventListener('input', () => { cv.value = cv.value.replace(/\D/g, ''); sync(); });
    zp.addEventListener('input', () => { zp.value = zp.value.replace(/\D/g, ''); sync(); });

    ex.addEventListener('blur', () => flag(ex, !!ex.value && !expOk(), 'Check the expiry date.'));
    $('testcard').addEventListener('click', () => { cn.value = '4242 4242 4242 4242'; ex.value = '12 / 28'; cv.value = '123'; nm.value = name || 'Test Member'; zp.value = '10001'; document.querySelectorAll('.cardbox .bad').forEach((x) => x.classList.remove('bad')); help.style.display = 'none'; sync(); });
    sync();

  }

  }

      promoOpen: this.state.promo ? 'true' : 'false',
      promoDisp: this.state.promo ? 'block' : 'none',
      togglePromo: () => this.togglePromo()
    };
  }
}

})();</script>
