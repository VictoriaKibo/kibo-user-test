        : { kicker: 'Next step', kickInk: '#0432FF', title: 'Book your blood draw', sub: 'At home or at a lab nearby', cta: 'Choose a time', aria: 'Next step: book your blood draw' },
      tl: {
        t1: bkd ? 'Your draw is booked' : 'Book your draw', s1: bkd ? bkd.when + ' · ' + bkd.whereShort : 'At home or at a lab nearby',
        bg1: bkd ? '#39C684' : '#0432FF', ink1: '#FFFFFF', ring1: bkd ? 'none' : '0 0 0 6px #E6EBFF', pb1: 26,
        bg2: bkd ? '#0432FF' : '#F3F5FF', ink2: bkd ? '#FFFFFF' : '#16358B', ring2: bkd ? '0 0 0 6px #E6EBFF' : 'none', pb2: 26,
        bg3: '#F3F5FF', ink3: '#16358B', ring3: 'none', pb3: 0
      },
      colDisp: pre ? 'none' : 'flex',
      fcard: pre
        ? { pad: '0', dir: 'row', gap: '0', lpad: '48px 40px 40px', box: 500, scale: 500 / 480, discSize: 12 }
        : { pad: '24px', dir: 'column', gap: '16px', lpad: '0', box: 624, scale: 1.3, discSize: 13 },
      panel: st.ready
        ? { kicker: 'New results are in', title: 'Your results are ready', body: 'Your blood work from ' + bkd.when.split(' at ')[0] + ' is back. Answer one quick question, then see your flower and plan.', cta: 'See my results', list: false }
        : bkd
        ? { kicker: 'You’re booked', title: 'See you ' + bkd.when.split(' at ')[0].split(', ')[0], body: bkd.when + ' · ' + bkd.whereShort + '. Your flower fills in a few days after your draw.', cta: 'See how to prepare', list: false }
        : { kicker: 'Next step', list: true, title: 'Book your first blood draw', body: 'At home or at a lab nearby. Your results complete your picture across all ten areas, and your first actions follow.', cta: 'Book my draw' },
      notReady: !st.ready, ready: !!st.ready,
      goReadyRef: (el) => { this.goReadyEl = el; },
      stepAct: () => st.ready ? this.setState({ ciOpen: true }) : this.setState({ bookOpen: true, bkDone: !!st.booked, prepOnly: !!st.booked }),
      panelAct: () => st.ready ? this.setState({ ciOpen: true }) : this.setState({ bookOpen: true, bkDone: !!st.booked, prepOnly: !!st.booked }),
      card3sub: st.ready ? 'Ready to see now' : 'Ready a few days after your draw',
      rtoast: !!st.rtoast,
      ciOpen: !!st.ciOpen,
      closeCi: () => this.setState({ ciOpen: false }),
      ci: (() => {
        const canSave = !!st.ci && (st.ci !== 'mt' || st.mtNow !== null);
        const o = (on, l, pick) => ({ l, pick, on: on ? 'true' : 'false', border: on ? '2px solid #0432FF' : '1px solid #E6E6EA', bg: on ? '#F3F5FF' : '#FFFFFF', ring: on ? '#0432FF' : '#B9BCCB', dot: on ? '#0432FF' : 'transparent' });
        return {
          opts: [['none', 'No changes'], ['active', 'I’ve started active treatment again, such as chemotherapy, radiation or surgery'], ['mt', 'I started or stopped ongoing cancer medicine']]
            .map(([id, l]) => o(st.ci === id, l, () => this.setState({ ci: id, mtNow: id === 'mt' ? st.mtNow : null }))),
          mtShow: st.ci === 'mt',
          mtOpts: [[true, 'Yes'], [false, 'No']].map(([v, l]) => o(st.mtNow === v, l, () => this.setState({ mtNow: v }))),
          disabled: canSave ? 'false' : 'true', op: canSave ? 1 : 0.35,
          can: canSave, cannot: !canSave,
          save: () => { this.ls('kibo-live', '1'); this.ls('kibo-live-st', null); this.ls('kibo-meals', null); this.ls('kibo-ci', st.ci === 'active' ? 'active' : st.ci === 'mt' ? (st.mtNow ? 'mtYes' : 'mtNo') : 'none'); this.ls('kibo-reveal-go', '1'); setTimeout(() => this.setState({ ci: null, mtNow: null }), 400); }
        };
      })(),
      note: (() => {
        const pause = 'M12 3l9 16H3zM12 10v4M12 17.2v.1', info = 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 11v5M12 7.8v.1', ok = 'M5 12.5l4.5 4.5L19 7.5';
        const N = {
          active: { bg: '#FFF7EB', border: '#F3D9A4', ink: '#9A5B00', icon: pause, title: 'Supplement and fasting guidance paused', body: 'Because your treatment has changed, we’ve paused supplement and fasting guidance. Please talk with your oncology team before continuing any supplements or fasting. Your everyday actions continue.' },
          mtYes: { bg: '#F3F5FF', border: '#C0CCFF', ink: '#0432FF', icon: info, title: 'Ask your oncology team about supplements', body: 'Because you take ongoing cancer medicine, your plan won’t suggest supplement doses. Ask your oncology team whether a supplement is right for you. Your everyday actions continue.' },
          mtNo: { bg: '#F3F5FF', border: '#C0CCFF', ink: '#0432FF', icon: info, title: 'Supplement guidance updated', body: 'You’ve stopped ongoing cancer medicine, so your supplement guidance includes standard ranges again. Check with your physician before starting any supplement.' },
          none: { bg: '#EFF5F2', border: '#96D9BA', ink: '#278157', icon: ok, title: 'Your plan is up to date', body: 'No changes to your treatment, so your plan is built from your new results as usual.' }
        };
        const pn = this.props.ci && this.props.ci !== 'saved' ? this.props.ci : this.ls('kibo-ci'); const n = !pre && pn && N[pn] ? N[pn] : null;
        return n ? Object.assign({ show: true }, n) : { show: false };
      })(),
      rv: (() => {
        const hs = (() => { try { return JSON.parse(this.ls('kibo-hs') || 'null'); } catch (e) { return null; } })();
        const CAN = ['breast cancer', 'prostate cancer', 'colorectal cancer', 'lung cancer', 'ovarian cancer', 'kidney cancer', 'thyroid cancer', 'cervical cancer', 'pancreatic cancer', 'lymphoma', 'leukemia', 'melanoma'];
        const MON = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };
        const sample = !hs;
        const h = hs || { type: 0, fin_m: 'Mar', fin_y: '2023' };
        const t = Number(h.type);
        const cancer = h.type === undefined || h.type === null || h.type === '' ? 'your cancer' : t === 12 ? ((h.type_other || '').trim() ? (h.type_other || '').trim() : 'your cancer') : (CAN[t] || 'your cancer');
        const fin = h.fin_m && h.fin_y ? (MON[h.fin_m] || h.fin_m) + ' ' + h.fin_y : '';
        const join = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
        const strong = areas.filter(a => a.s >= 8).map(a => a.name);
        const low = areas.slice().sort((a, b) => a.s - b.s)[0];
        const pn = this.props.ci && this.props.ci !== 'saved' ? this.props.ci : this.ls('kibo-ci');
        const PN = {
          active: 'Because your treatment has changed, we’ve paused supplement and fasting guidance in your plan for now. Your everyday actions continue.',
          mtYes: 'Because you take ongoing cancer medicine, your plan checks with your oncology team before any supplement.',
          mtNo: 'Now that you’ve stopped ongoing cancer medicine, your supplement guidance is updated too.'
        };
        return {
          on: !!st.rvOn, off: !st.rvOn, score: String(st.rvN || 0), kicker: 'Your results are in, ' + nm,
          story: 'This flower is yours. It grew from your blood work and everything you shared with us: your ' + cancer + ', your treatment, and how you live today.' + (fin ? ' You finished treatment in ' + fin + '. This is about what comes next.' : ''),
          strongT: join(strong) + (strong.length > 1 ? ' are' : ' is') + ' already at 8 out of 10 or higher. Keep doing what you’re doing.',
          lowT: low.name + ', at ' + low.s + ' out of 10. Your first actions were chosen with it in mind.',
          note: pn && PN[pn] ? PN[pn] : '', hasNote: !!(pn && PN[pn]),
          goNone: !pn || !PN[pn], goActive: pn === 'active', goYes: pn === 'mtYes', goNo: pn === 'mtNo',
          go: () => this.ls('kibo-plan-toast', pn && PN[pn] ? pn : 'none'),
          replay: () => this.playReveal()
        };
      })(),
      bookOpen: !!st.bookOpen,
      openBook: () => this.setState({ bookOpen: true, bkDone: !!st.booked, prepOnly: !!st.booked }),
      changeBook: () => this.setState({ bkDone: false }),
      closeBook: () => this.setState({ bookOpen: false }),
      showResults: () => this.setState({ bookOpen: false, resultsIn: true }),
      bk,
      intro: pre
        ? { kicker: 'Your health story is in', title: 'Every area already has your answers behind it', body: 'Click any area to see what you told us and what your blood work will add. Your flower fills in a few days after your draw.' }
        : { kicker: 'Your ten areas, one system', title: 'Each area is shaped by your own story', body: 'Your flower brings together your blood work, health story and DNA. Click any area to see what shapes it and your plan for it.' },
      unhover: () => this.setState({ hov: null }),
      close: () => this.setState({ sel: null }),
      openFocus: () => this.setState({ sel: 'heart', act: null, seen: { ...st.seen, heart: true } }),
      centerCursor: pre ? 'default' : 'pointer',
      centerAct: () => { if (pre) return; if (st.hov) { this.setState({ sel: st.hov, seen: { ...st.seen, [st.hov]: true } }); } else { this.setState({ act: null, sel: null }); } }
    };
  }
}

return Component;
})();</script>
