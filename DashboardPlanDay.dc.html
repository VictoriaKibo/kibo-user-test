.bk-ok{width:76px;height:76px;border-radius:50%;background:#39C684;display:grid;place-items:center;box-shadow:0 0 0 10px #EAF8F1;animation:bkpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bkin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes bkpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.bk-btn{transition:transform .2s ease}
.rb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;will-change:transform}
.rb1{width:460px;height:460px;left:-140px;top:-160px;background:#2246D6;opacity:.9;animation:rbA 9s ease-in-out infinite alternate}
.rb2{width:420px;height:420px;right:-150px;top:10%;background:#A8B4EC;opacity:.7;animation:rbB 11s ease-in-out infinite alternate}
.rb3{width:500px;height:500px;left:10%;bottom:-260px;background:#9670E6;opacity:.9;animation:rbC 10s ease-in-out infinite alternate}
.rb4{width:300px;height:300px;left:45%;top:30%;background:#5F78E2;opacity:.8;animation:rbD 7s ease-in-out infinite alternate}
.rb5{width:280px;height:280px;left:-60px;top:40%;background:#2E50D8;opacity:.85;animation:rbE 8s ease-in-out infinite alternate}
.rb6{width:320px;height:320px;right:-80px;bottom:-60px;background:#A37DEA;opacity:.85;animation:rbF 9.5s ease-in-out infinite alternate}
.flow{position:absolute;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);pointer-events:none;filter:blur(22px)}
.d-panel .grain{opacity:1!important;mix-blend-mode:soft-light}
.d-panel .grain::after{content:"";position:absolute;inset:0;background:inherit;opacity:.55;mix-blend-mode:overlay}
.grain{position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.62;mix-blend-mode:overlay;pointer-events:none}
@keyframes rbE{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-200px,260px) scale(1.3)}}
@keyframes rbF{0%{transform:translate(0,0) scale(1.2)}100%{transform:translate(240px,-200px) scale(.9)}}
@keyframes rbA{0%{transform:translate(0,0) scale(1)}100%{transform:translate(260px,200px) scale(1.2)}}
@keyframes rbB{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-280px,180px) scale(1.15)}}
@keyframes rbC{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(220px,-240px) scale(.9)}}
@keyframes rbD{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-240px,-160px) scale(1.35)}}

.rad h2,.rad p,.rad li{text-shadow:0 1px 12px rgba(20,20,80,0.22)}
